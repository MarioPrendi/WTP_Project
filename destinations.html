<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase | Destinations</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/destinations.css">
</head>
<body class="site">

    <!-- Navigation Bar -->
    <header class="site-header">
        <nav class="navbar">
            <h2 class="logo">TravelEase</h2>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html" class="active">Destinations</a></li>
                <li><a href="planner.html">Trip Planner</a></li>
                <li><a href="favorites.html">Favorites <span id="favCount" class="badge" hidden>0</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-intro">
            <h1>Destinations</h1>
            <p>Search, filter and sort every place in the collection. Tap the heart to save one.</p>
        </section>

        <!-- Search and filters -->
        <section class="toolbar" aria-label="Search and filters">
            <input type="search" id="searchInput" placeholder="Search by name or country" aria-label="Search destinations">

            <select id="categoryFilter" aria-label="Filter by category">
                <option value="all">All categories</option>
                <option value="beaches">Beaches</option>
                <option value="mountains">Mountains</option>
                <option value="historical cities">Historical cities</option>
                <option value="cities">Cities</option>
            </select>

            <select id="priceFilter" aria-label="Filter by price">
                <option value="all">Any price</option>
                <option value="400">Up to &euro;400</option>
                <option value="600">Up to &euro;600</option>
                <option value="1000">Up to &euro;1000</option>
            </select>

            <select id="sortSelect" aria-label="Sort destinations">
                <option value="default">Sort: default</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
            </select>
        </section>

        <p id="resultCount" class="result-count" aria-live="polite"></p>

        <div id="featured-container" class="card-grid"></div>
        <p id="noResults" class="empty" hidden>No destinations match your filters. Clear the search or choose another category.</p>
    </main>

    <footer class="site-footer">
        <p>TravelEase &copy; 2026</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/destinations.js"></script>
</body>
</html>
